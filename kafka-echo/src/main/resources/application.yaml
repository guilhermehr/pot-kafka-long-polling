spring:
  application:
    name: kafka-echo
  lifecycle:
    # Tempo máximo de cada fase do encerramento (o dreno de requisições pendentes e a espera do servidor web).
    timeout-per-shutdown-phase: ${SHUTDOWN_PHASE_TIMEOUT:20s}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # Cada instância usa um group.id novo; "latest" evita reprocessar o histórico do tópico.
      auto-offset-reset: latest
      # Máximo de eventos por poll() = tamanho máximo do lote entregue ao listener.
      max-poll-records: ${MAX_POLL_RECORDS:50}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        # Rebalance cooperativo (incremental): só as partições que mudam de dono são movidas.
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
    listener:
      type: batch
      # Threads de consumer por instância (todas no mesmo group.id da instância).
      # Acima do número de partições do tópico, as threads extras ficam ociosas.
      concurrency: ${LISTENER_CONCURRENCY:3}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # Hierarquia de timeouts: max.block < request.timeout < delivery.timeout <= app.request.timeout < timeout do BFF.
        # Exigência do Kafka: delivery.timeout.ms >= linger.ms + request.timeout.ms.
        max.block.ms: ${PRODUCER_MAX_BLOCK_MS:1500}
        request.timeout.ms: ${PRODUCER_REQUEST_TIMEOUT_MS:3000}
        delivery.timeout.ms: ${PRODUCER_DELIVERY_TIMEOUT_MS:8000}

server:
  port: ${PORT:8080}
  # Encerramento gracioso: termina as requisições em andamento antes de parar o servidor web.
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true            # /actuator/health/liveness e /actuator/health/readiness
      group:
        readiness:
          # Pronta só quando o listener Kafka tem todas as partições atribuídas (e não está em encerramento).
          include: readinessState,kafkaAssignment

app:
  # Vazio = resolvido automaticamente (nome do pod no Kubernetes, ou <app-name>-<sufixo aleatório>).
  instance-id: ${INSTANCE_ID:}
  kafka:
    topic: echo-events
    # Só vale na criação do tópico; um tópico já existente não é alterado.
    partitions: ${TOPIC_PARTITIONS:3}
    replication-factor: 1
    group-prefix: echo-consumer
    headers:
      correlation-id: x-correlation-id
      service-instance-id: x-service-instance-id
  listener:
    # Máximo de eventos de um mesmo lote processados em paralelo (threads virtuais).
    batch-parallelism: ${LISTENER_PARALLELISM:50}
  producer:
    # Publicação fora das threads do Tomcat, em um pool limitado (bulkhead).
    # Fila cheia = 503 imediato; tarefa que esperou mais que app.request.timeout é descartada.
    threads: ${PUBLISHER_THREADS:8}
    queue-capacity: ${PUBLISHER_QUEUE:200}
  request:
    # Tempo máximo que o endpoint aguarda a resposta vinda do Kafka (depois disso: 504).
    timeout: ${REQUEST_TIMEOUT:10s}
  shutdown:
    # Tempo máximo, no encerramento, aguardando as requisições pendentes terminarem.
    drain-timeout: ${DRAIN_TIMEOUT:12s}
  # Atrasos artificiais, apenas para testes.
  test-delay:
    producer: ${PRODUCER_DELAY:0ms}   # não bloqueante, aplicado antes de enfileirar a publicação
    consumer: ${CONSUMER_DELAY:0ms}   # Thread.sleep no listener, só nos eventos desta instância com requisição pendente
